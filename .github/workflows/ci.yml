name: CI pruebas automatizadas en dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test_app:
    name: Unit + Integración + E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar estructura
        run: |
          echo "== Raíz =="
          ls -la
          echo "== app/ =="
          ls -la app/
          echo "== tests/ =="
          find tests -type f

      - name: Pruebas UNIT
        run: python -m pytest tests/unit -m unit --cov=app --cov-report=term-missing

      - name: Pruebas INTEGRACIÓN
        run: python -m pytest tests/integration -m integration

      - name: Pruebas E2E
        run: python -m pytest tests/e2e -m e2e

      - name: Reporte final
        if: always()
        run: echo "✅ Pipeline finalizado"